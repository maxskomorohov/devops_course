---
apiVersion: v1
kind: Namespace
metadata:
  name: hw23
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: hw23
  labels:
    app: server
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - name: http
          containerPort: 80
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
  namespace: hw23
spec:
  type: ClusterIP
  selector:
    app: server
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80

