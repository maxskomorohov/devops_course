---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop:
    - ca-certificates
    - curl

- name: Create directory for Docker APT keyring
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Detect Debian architecture
  ansible.builtin.command: dpkg --print-architecture
  register: docker_arch
  changed_when: false

- name: Add Docker stable repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_facts["distribution_release"] }} stable
    state: present
    filename: docker
    update_cache: true

- name: Install Docker Engine and Docker Compose plugin
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

- name: Ensure Docker service is running and enabled
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Add users to Docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ target_user }}"