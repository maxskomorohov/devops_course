services:
  app:
    container_name: petclinic
    image: maks1020/petclinic:test
    platform: linux/arm64
    networks:
      - app
      - monitoring
    ports:
      - "80:8080"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1024M"

  cadvisor:
    image: ghcr.io/google/cadvisor:latest
    container_name: cadvisor
    privileged: true
    security_opt:
      - label:disable
    networks:
      - monitoring
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd:/run/containerd:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    restart: unless-stopped
    ports:
      - "8081:8080"

networks:
  app:
  monitoring: