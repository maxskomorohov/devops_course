global:
  scrape_interval: 10s
  evaluation_interval: 10s

# Pointing to the alert rules file
rule_files:
  - "alert_rules.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]

  - job_name: 'petclinic-node-exporter'
    static_configs:
      - targets: [ '10.0.1.31:9100' ]
    metrics_path: '/metrics'

  - job_name: 'petclinic-cadvisor'
    static_configs:
      - targets: [ '10.0.1.31:8081' ]
    metrics_path: '/metrics'