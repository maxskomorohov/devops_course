---
apiVersion: v1
kind: Namespace
metadata:
  name: hw24
  labels:
    name: hw24

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hw24-dp
  namespace: hw24
  labels:
    app: random
spec:
  replicas: 2
  selector:
    matchLabels:
      app: random
  template:
    metadata:
      labels:
        app: random
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: random-app
          image: maks1020/hw24:latest
          ports:
            - name: http
              containerPort: 8082

---
apiVersion: v1
kind: Service
metadata:
  name: hw24-svc
  namespace: hw24
spec:
  type: ClusterIP
  selector:
    app: random
  ports:
    - name: http
      port: 8080
      targetPort: 8082

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hw24-ingress
  namespace: hw24
spec:
  ingressClassName: nginx
  rules:
    - host: hw24.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hw24-svc
                port:
                  number: 8080